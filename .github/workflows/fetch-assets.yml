name: fetch-assets
on:
  push:
    branches: [site-rebuild]
    paths: [.github/workflows/fetch-assets.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pages and images
        run: |
          mkdir -p _fetched
          F=https://framerusercontent.com/images
          curl -sSL "$F/vX7DswBq6qjYLQ7ZWAZWPcc4BE.jpeg" -o _fetched/logo-flexispot.jpeg
          curl -sSL "$F/8YrnixUWk0Eio2l7STIIdZNK8g.jpg" -o _fetched/logo-blacklyte.jpg
          curl -sSL "$F/3efrTTHERpCLey0V6fokkCECJ0.jpg" -o _fetched/logo-gravastar.jpg
          curl -sSL "$F/OkLDb5V2FT4dMXMQw2ULCgYJ1o.jpg" -o _fetched/logo-hexgaming.jpg
          curl -sSL "$F/64wZlNRce87CD1okiui0uW5G18.jpg" -o _fetched/portrait.jpg
          curl -sSL "$F/nUUruwxnVfhyZpCkRLS6TKMILk.jpg" -o _fetched/og.jpg
          curl -sSL "$F/GrOBkDEx2Y8Gcw6B3bih1juIls.jpg" -o _fetched/favicon.jpg
          for id in x3XlALrMMuU 5G1u5PJHsxs; do curl -sSL "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" -o "_fetched/oembed-$id.json" || true; done
          ls -la _fetched
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _fetched
          git commit -m "Fetch remote assets (2)" && git push

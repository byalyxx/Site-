# Refreshes the media kit's numbers every morning by calling the site's refresh endpoint.
# Needs the repository secret MEDIA_KIT_ADMIN_KEY (the same value as in Hostinger). The site address
# defaults to https://byalyxx.com; set a repository variable SITE_URL to use another one.
# GitHub only runs schedules from the default branch (main), so this starts once the site is merged there.
name: Refresh media kit stats

on:
  schedule:
    - cron: "20 5 * * *" # 05:20 UTC daily
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the refresh endpoint
        env:
          KEY: ${{ secrets.MEDIA_KIT_ADMIN_KEY }}
          SITE: ${{ vars.SITE_URL || 'https://byalyxx.com' }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::MEDIA_KIT_ADMIN_KEY isn't set yet, so there's nothing to refresh."
            exit 0
          fi
          # Hostinger sometimes answers with a 307 back to the same address, so follow it (same host, so the
          # key goes along). Its proxy gives up after a minute with a 504 while the refresh carries on to the end
          # on the server, so a 504 is fine; anything else that isn't the refresh's own JSON is an error.
          code=$(curl -sS -L --max-redirs 5 -X POST "$SITE/api/media-kit/sync" \
            -H "Authorization: Bearer $KEY" --max-time 300 -o out.json -w "%{http_code}") || true
          cat out.json; echo
          if [ "$code" = "504" ]; then echo "::notice::Still running on the server after a minute; it finishes on its own."; exit 0; fi
          case "$(head -c1 out.json)" in "{") ;; *) echo "::error::The refresh didn't answer with its results (HTTP $code)."; exit 1;; esac
          [ "$code" = "200" ] || exit 1

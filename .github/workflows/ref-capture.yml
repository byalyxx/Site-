# Temporary: screenshots the design reference so its layout can be studied. Delete after use.
# The images are stored as loose git objects (no branch, tag or commit points at them), so nothing lands in the repo's history.
name: ref-capture
on:
  push:
    branches: [claude/project-thread-9lxlz3]
    paths: [".github/workflows/ref-capture.yml", ".github/ref-capture/**"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          mkdir /tmp/cap && cd /tmp/cap && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/.github/ref-capture/capture.mjs . && node capture.mjs
      - name: Store screenshots as loose objects and print the tree id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: cd /tmp/cap/out && python3 $GITHUB_WORKSPACE/.github/ref-capture/store.py
